<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" fill="none" role="img" aria-label="Cold Brew Caramel Flan">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1F150C"/>
      <stop offset="60%" stop-color="#181008"/>
      <stop offset="100%" stop-color="#100A05"/>
    </radialGradient>
    <radialGradient id="plate3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8E0D0"/>
      <stop offset="80%" stop-color="#D8CDC4"/>
      <stop offset="100%" stop-color="#C4B8A8"/>
    </radialGradient>
    <linearGradient id="custard3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4B896"/>
      <stop offset="100%" stop-color="#B89674"/>
    </linearGradient>
    <linearGradient id="caramel3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A65A1E"/>
      <stop offset="100%" stop-color="#7A3E12"/>
    </linearGradient>
    <filter id="shadow3" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow3"><feGaussianBlur stdDeviation="35"/></filter>
  </defs>
  <rect width="900" height="1100" fill="url(#bg3)"/>
  <ellipse cx="450" cy="180" rx="350" ry="200" fill="#C9A96A" opacity="0.06" filter="url(#glow3)"/>
  <ellipse cx="450" cy="920" rx="380" ry="80" fill="#000" opacity="0.4"/>
  <ellipse cx="450" cy="880" rx="340" ry="68" fill="url(#plate3)"/>
