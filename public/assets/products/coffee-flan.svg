  <path d="M280 830 v-280 q0 -180 170 -180 q170 0 170 180 v280 z" fill="url(#custard3)" filter="url(#shadow3)"/>
  <ellipse cx="450" cy="450" rx="140" ry="38" fill="url(#caramel3)"/>
  <g stroke="#7A3E12" stroke-width="3" fill="none" opacity="0.9">
