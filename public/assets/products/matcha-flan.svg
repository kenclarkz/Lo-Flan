<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" fill="none" role="img" aria-label="Ceremonial Matcha Flan">
  <defs>
    <radialGradient id="bg6" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#141A0E"/>
      <stop offset="60%" stop-color="#0E140A"/>
      <stop offset="100%" stop-color="#080C06"/>
    </radialGradient>
    <radialGradient id="plate6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8ECD0"/>
      <stop offset="80%" stop-color="#D4DCB8"/>
      <stop offset="100%" stop-color="#C0C8A0"/>
    </radialGradient>
    <linearGradient id="custard6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8D8A8"/>
      <stop offset="100%" stop-color="#78B878"/>
    </linearGradient>
    <linearGradient id="caramel6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A96A"/>
      <stop offset="100%" stop-color="#A8873F"/>
    </linearGradient>
    <filter id="shadow6" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow6"><feGaussianBlur stdDeviation="35"/></filter>
  </defs>
  <rect width="900" height="1100" fill="url(#bg6)"/>
  <ellipse cx="450" cy="180" rx="350" ry="200" fill="#A8D8A8" opacity="0.06" filter="url(#glow6)"/>
  <ellipse cx="450" cy="920" rx="380" ry="80" fill="#000" opacity="0.35"/>
  <ellipse cx="450" cy="880" rx="340" ry="68" fill="url(#plate6)"/>
  <ellipse cx="450" cy="886" rx="280" ry="52" fill="#F0F4E8"/>
  <ellipse cx="450" cy="852" rx="170" ry="22" fill="#000" opacity="0.3" filter="url(#glow6)"/>
  <path d="M280 830 v-280 q0 -180 170 -180 q170 0 170 180 v280 z" fill="url(#custard6)" filter="url(#shadow6)"/>
  <ellipse cx="450" cy="450" rx="140" ry="38" fill="url(#caramel6)"/>
  <g stroke="#A8873F" stroke-width="3" fill="none" opacity="0.9">
    <path d="M340 450 q-18 70 4 140"/>
    <path d="M410 440 q-12 90 8 180"/>
    <path d="M500 445 q10 85 -2 160"/>
    <path d="M570 450 q16 75 -6 145"/>
  </g>
  <ellipse cx="450" cy="450" rx="100" ry="26" fill="#C9A96A"/>
  <!-- Matcha powder mound -->
  <g fill="#5A8A5A" opacity="0.9">
    <ellipse cx="450" cy="420" rx="80" ry="18"/>
    <ellipse cx="450" cy="410" rx="70" ry="16"/>
    <ellipse cx="450" cy="402" rx="55" ry="14"/>
  </g>
  <g fill="#78B878" opacity="0.6">
    <ellipse cx="450" cy="402" rx="50" ry="12"/>
    <ellipse cx="450" cy="396" rx="40" ry="10"/>
  </g>
  <!-- Whisk pattern lines -->
  <g stroke="#4A6A4A" stroke-width="1.5" opacity="0.4">
    <path d="M380 420 q10 -8 20 -5 q15 5 20 12"/>
    <path d="M450 420 q-10 -8 -20 -5 q-15 5 -20 12"/>
    <path d="M450 410 q0 -12 0 -24"/>
  </g>
