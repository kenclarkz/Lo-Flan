  <ellipse cx="450" cy="450" rx="100" ry="26" fill="#6A3E18"/>
  <!-- Chocolate shavings on top -->
  <g fill="#3E2A1E" opacity="0.8">
    <path d="M320 480 q10 -15 25 -5 q10 8 15 20 q-8 10 -20 15 q-12 -5 -20 -20"/>
    <path d="M460 460 q12 -12 28 -2 q10 10 12 22 q-6 8 -16 14 q-14 -4 -24 -16"/>
    <path d="M580 490 q8 -10 22 -2 q12 8 14 20 q-5 8 -14 12 q-10 -4 -18 -14"/>
  </g>
  <!-- Cocoa dust -->
  <g fill="#4A2E1C" opacity="0.4">
    <circle cx="350" cy="510" r="2"/>
    <circle cx="420" cy="490" r="1.5"/>
    <circle cx="500" cy="520" r="2"/>
    <circle cx="560" cy="480" r="1.5"/>
    <circle cx="330" cy="550" r="1.5"/>
    <circle cx="470" cy="560" r="2"/>
