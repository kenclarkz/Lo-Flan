<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" fill="none" role="img" aria-label="Belgian Chocolate Flan">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1A0E08"/>
      <stop offset="60%" stop-color="#140A06"/>
      <stop offset="100%" stop-color="#0D0704"/>
    </radialGradient>
    <radialGradient id="plate4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D8C8B8"/>
      <stop offset="80%" stop-color="#C4B09C"/>
      <stop offset="100%" stop-color="#B09880"/>
    </radialGradient>
    <linearGradient id="custard4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A2E1C"/>
      <stop offset="100%" stop-color="#362216"/>
    </linearGradient>
    <linearGradient id="caramel4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A451D"/>
      <stop offset="100%" stop-color="#5A2E12"/>
    </linearGradient>
    <filter id="shadow4" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <filter id="glow4"><feGaussianBlur stdDeviation="35"/></filter>
  </defs>
  <rect width="900" height="1100" fill="url(#bg4)"/>
  <ellipse cx="450" cy="180" rx="350" ry="200" fill="#C9A96A" opacity="0.05" filter="url(#glow4)"/>
  <ellipse cx="450" cy="920" rx="380" ry="80" fill="#000" opacity="0.45"/>
  <ellipse cx="450" cy="880" rx="340" ry="68" fill="url(#plate4)"/>
  <ellipse cx="450" cy="886" rx="280" ry="52" fill="#D8C8B8"/>
  <ellipse cx="450" cy="852" rx="170" ry="22" fill="#000" opacity="0.4" filter="url(#glow4)"/>
  <path d="M280 830 v-280 q0 -180 170 -180 q170 0 170 180 v280 z" fill="url(#custard4)" filter="url(#shadow4)"/>
  <ellipse cx="450" cy="450" rx="140" ry="38" fill="url(#caramel4)"/>
  <g stroke="#5A2E12" stroke-width="3" fill="none" opacity="0.9">
    <path d="M340 450 q-18 70 4 140"/>
    <path d="M410 440 q-12 90 8 180"/>
    <path d="M500 445 q10 85 -2 160"/>
    <path d="M570 450 q16 75 -6 145"/>
