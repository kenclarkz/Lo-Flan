<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" fill="none" role="img" aria-label="Tahitian Vanilla Bean Flan">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#2A1A0E"/>
      <stop offset="60%" stop-color="#221408"/>
      <stop offset="100%" stop-color="#120C08"/>
    </radialGradient>
    <radialGradient id="plate2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7F0E3"/>
      <stop offset="80%" stop-color="#EFE4D0"/>
      <stop offset="100%" stop-color="#DCC9A8"/>
    </radialGradient>
    <linearGradient id="custard2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="100%" stop-color="#F0E0B8"/>
    </linearGradient>
    <linearGradient id="caramel2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9A36A"/>
      <stop offset="100%" stop-color="#A96A2F"/>
    </linearGradient>
    <filter id="shadow2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow2"><feGaussianBlur stdDeviation="35"/></filter>
  </defs>
  <rect width="900" height="1100" fill="url(#bg2)"/>
  <ellipse cx="450" cy="180" rx="350" ry="200" fill="#E3C88C" opacity="0.08" filter="url(#glow2)"/>
  <ellipse cx="450" cy="920" rx="380" ry="80" fill="#000" opacity="0.35"/>
  <ellipse cx="450" cy="880" rx="340" ry="68" fill="url(#plate2)"/>
  <ellipse cx="450" cy="886" rx="280" ry="52" fill="#FBF7EE"/>
  <ellipse cx="450" cy="852" rx="170" ry="22" fill="#000" opacity="0.3" filter="url(#glow2)"/>
  <path d="M280 830 v-280 q0 -180 170 -180 q170 0 170 180 v280 z" fill="url(#custard2)" filter="url(#shadow2)"/>
  <ellipse cx="450" cy="450" rx="140" ry="38" fill="url(#caramel2)"/>
  <g stroke="#A96A2F" stroke-width="3" fill="none" opacity="0.9">
    <path d="M340 450 q-18 70 4 140"/>
    <path d="M410 440 q-12 90 8 180"/>
    <path d="M500 445 q10 85 -2 160"/>
    <path d="M570 450 q16 75 -6 145"/>
  </g>
  <ellipse cx="450" cy="450" rx="100" ry="26" fill="#C97B2C"/>
  <!-- Vanilla bean on plate -->
  <g transform="translate(450, 890)">
    <path d="M-80 0 q0 -20 40 -20 q40 0 40 20 q0 15 -20 15 q-20 0 -20 -15" fill="#3C2415" opacity="0.9"/>
    <path d="M-40 0 q0 -15 20 -15 q20 0 20 15 q0 10 -10 10 q-10 0 -10 -10" fill="#4A2E1C" opacity="0.9"/>
  </g>
  <!-- Gold flecks -->
  <g fill="#E3C88C" opacity="0.6">
    <circle cx="380" cy="520" r="3"/>
    <circle cx="520" cy="500" r="2"/>
    <circle cx="360" cy="580" r="2"/>
    <circle cx="540" cy="560" r="3"/>
    <circle cx="400" cy="620" r="2"/>
    <circle cx="500" cy="600" r="2"/>
  </g>
</svg>