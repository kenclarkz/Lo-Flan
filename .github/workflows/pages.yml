name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: /Lo-Flan
        run: |
          echo "::notice::node=$(node -v) npm=$(npm -v)"
          echo "::notice::config sha256=$(sha256sum next.config.mjs | awk '{print $1}')"
          echo "::notice::config size=$(wc -c < next.config.mjs)"
          echo "::notice::config content: $(cat next.config.mjs | tr '\n' ' ')"
          node -e "import('./next.config.mjs').then(()=>console.log('config loads OK')).catch(e=>{console.log('CONFIG LOAD FAILED:', e.message); console.log(e.stack.split('\n').slice(0,8).join(' '))})" || true
          set +e
          npm run build 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "::error::BUILD FAILED (exit $status). Log tail: $(tail -c 4000 /tmp/build.log | tr '\n' ' ')"
            exit $status
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
